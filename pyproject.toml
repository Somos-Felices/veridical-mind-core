[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veridical-mind-core"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "python-dotenv",
    "openai",
    "qdrant-client",
    "fastembed==0.8.1",
    "pytest",
    "langfuse",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

